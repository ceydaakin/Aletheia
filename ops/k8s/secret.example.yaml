# Shape only. Do not commit a filled-in copy of this file.
#
#   kubectl -n aletheia create secret generic aletheia \
#     --from-literal=postgres-password="$(openssl rand -base64 24)" \
#     --from-literal=database-url='postgresql://aletheia:PASSWORD@postgres:5432/aletheia' \
#     --from-literal=tenants='demo:REPLACE_ME:0.05'
#
apiVersion: v1
kind: Secret
metadata:
  name: aletheia
  namespace: aletheia
type: Opaque
stringData:
  postgres-password: "CHANGE_ME"
  database-url: "postgresql://aletheia:CHANGE_ME@postgres:5432/aletheia"
  # tenant_id:api_key:default_risk_budget, comma separated. The risk budget is
  # per tenant because a bank and a docs site do not share a tolerance for being
  # wrong.
  tenants: "demo:CHANGE_ME:0.05"
  # Only needed when GENERATION_BACKEND=anthropic.
  anthropic-api-key: ""
